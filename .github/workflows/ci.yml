name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check Zsh syntax
        run: zsh -n pwf && zsh -n tests/test-cli.zsh
      - name: Check whitespace
        run: git diff --check
      - name: Run CLI tests
        run: zsh tests/test-cli.zsh
